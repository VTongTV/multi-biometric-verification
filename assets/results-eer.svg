<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, Helvetica, sans-serif">
  <title>Error rates by modality and the effect of input resolution</title>
  <defs>
    <filter id="results-glowf" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="#100D0B"/>

  <text x="64" y="56" font-size="26" font-weight="bold" fill="#F6EDE1">Where each model sits on the error curve</text>
  <text x="64" y="78" font-size="14" fill="#9C8B7A">Equal error rate under a subject-disjoint split, one point per modality</text>

  <g id="results-det">
    <rect x="64" y="104" width="580" height="376" rx="10" fill="#221C18" stroke="#4A3E34"/>
    <text x="88" y="132" font-size="13" font-weight="bold" fill="#F0A63C">Detection error trade-off</text>
    <rect x="120" y="150" width="320" height="300" fill="#1A1512" stroke="#4A3E34"/>
    <path d="M120,450 L440,150" stroke="#4A3E34" stroke-width="1.5" stroke-dasharray="5 5" fill="none"/>
    <text x="434" y="166" font-size="10" fill="#9C8B7A" text-anchor="end">EER line</text>

    <g id="results-curves" fill="none" stroke-width="2.5" stroke-linecap="round">
      <path id="results-c-print" d="M120,200 C180,262 212,322 227,352 C262,402 340,422 440,432" stroke="#F0A63C"
        pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
        <animate attributeName="stroke-dashoffset" dur="12s" repeatCount="indefinite" values="100;100;0;0;100;100" keyTimes="0;0.10;0.30;0.95;1;1"/>
      </path>
      <path id="results-c-nir" d="M120,190 C190,242 242,282 276,304 C322,352 392,402 440,416" stroke="#FFCF7A" stroke-opacity="0.85"
        pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
        <animate attributeName="stroke-dashoffset" dur="12s" repeatCount="indefinite" values="100;100;0;0;100;100" keyTimes="0;0.20;0.40;0.95;1;1"/>
      </path>
      <path id="results-c-face" d="M120,180 C200,216 282,236 331,248 C372,292 402,372 440,400" stroke="#C08A4A"
        pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
        <animate attributeName="stroke-dashoffset" dur="12s" repeatCount="indefinite" values="100;100;0;0;100;100" keyTimes="0;0.30;0.50;0.95;1;1"/>
      </path>
      <path id="results-c-vis" d="M120,170 C222,190 312,204 366,214 C402,272 422,352 440,390" stroke="#B8322A"
        pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
        <animate attributeName="stroke-dashoffset" dur="12s" repeatCount="indefinite" values="100;100;0;0;100;100" keyTimes="0;0.40;0.60;0.95;1;1"/>
      </path>
    </g>

    <g id="results-marks">
      <circle cx="227" cy="352" r="7" fill="#100D0B" stroke="#F0A63C" stroke-width="3"/>
      <text x="227" y="376" font-size="10" fill="#F0A63C" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">0.34%</text>
      <circle cx="276" cy="304" r="7" fill="#100D0B" stroke="#FFCF7A" stroke-width="3"/>
      <text x="276" y="288" font-size="10" fill="#FFCF7A" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">0.91%</text>
      <circle cx="331" cy="248" r="7" fill="#100D0B" stroke="#C08A4A" stroke-width="3"/>
      <text x="331" y="232" font-size="10" fill="#C08A4A" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">2.91%</text>
      <circle cx="366" cy="214" r="7" fill="#100D0B" stroke="#B8322A" stroke-width="3"/>
      <text x="366" y="198" font-size="10" fill="#B8322A" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">5.84%</text>
    </g>

    <text x="120" y="470" font-size="10" fill="#9C8B7A">false accept rate</text>
    <text x="440" y="470" font-size="10" fill="#9C8B7A" text-anchor="end">1e-1</text>
    <text x="88" y="452" font-size="10" fill="#9C8B7A">false reject</text>
  </g>

  <g id="results-bars">
    <rect x="676" y="104" width="540" height="376" rx="10" fill="#221C18" stroke="#4A3E34"/>
    <text x="700" y="132" font-size="13" font-weight="bold" fill="#F0A63C">Equal error rate, lower is better</text>

    <text x="700" y="176" font-size="12" fill="#F6EDE1">fingerprint</text>
    <rect x="860" y="162" width="280" height="16" rx="8" fill="#2E2620" stroke="#4A3E34"/>
    <rect x="860" y="162" width="0" height="16" rx="8" fill="#F0A63C">
      <animate attributeName="width" dur="12s" repeatCount="indefinite" values="0;0;16;16;0;0" keyTimes="0;0.12;0.30;0.95;1;1"/>
    </rect>
    <text x="1188" y="176" font-size="12" fill="#F0A63C" text-anchor="end" font-family="Consolas, 'Courier New', monospace">0.34%</text>

    <text x="700" y="222" font-size="12" fill="#F6EDE1">iris, near-infrared</text>
    <rect x="860" y="208" width="280" height="16" rx="8" fill="#2E2620" stroke="#4A3E34"/>
    <rect x="860" y="208" width="0" height="16" rx="8" fill="#FFCF7A">
      <animate attributeName="width" dur="12s" repeatCount="indefinite" values="0;0;42;42;0;0" keyTimes="0;0.22;0.40;0.95;1;1"/>
    </rect>
    <text x="1188" y="222" font-size="12" fill="#FFCF7A" text-anchor="end" font-family="Consolas, 'Courier New', monospace">0.91%</text>

    <text x="700" y="268" font-size="12" fill="#F6EDE1">face, AT&amp;T</text>
    <rect x="860" y="254" width="280" height="16" rx="8" fill="#2E2620" stroke="#4A3E34"/>
    <rect x="860" y="254" width="0" height="16" rx="8" fill="#C08A4A">
      <animate attributeName="width" dur="12s" repeatCount="indefinite" values="0;0;136;136;0;0" keyTimes="0;0.32;0.50;0.95;1;1"/>
    </rect>
    <text x="1188" y="268" font-size="12" fill="#C08A4A" text-anchor="end" font-family="Consolas, 'Courier New', monospace">2.91%</text>

    <text x="700" y="314" font-size="12" fill="#F6EDE1">iris, visible light</text>
    <rect x="860" y="300" width="280" height="16" rx="8" fill="#2E2620" stroke="#4A3E34"/>
    <rect x="860" y="300" width="0" height="16" rx="8" fill="#B8322A">
      <animate attributeName="width" dur="12s" repeatCount="indefinite" values="0;0;272;272;0;0" keyTimes="0;0.42;0.60;0.95;1;1"/>
    </rect>
    <text x="1188" y="314" font-size="12" fill="#E5533F" text-anchor="end" font-family="Consolas, 'Courier New', monospace">5.84%</text>

    <text x="700" y="368" font-size="11" fill="#9C8B7A">Face reaches TAR 0.95 at FAR 1e-2,</text>
    <text x="700" y="386" font-size="11" fill="#9C8B7A">with a separability of d' = 3.72.</text>
    <text x="700" y="412" font-size="11" fill="#9C8B7A">Visible light iris costs 6.4 times</text>
    <text x="700" y="430" font-size="11" fill="#9C8B7A">the error rate of near-infrared.</text>
    <text x="700" y="456" font-size="11" fill="#9C8B7A">Bars share one scale, 0 to 6%.</text>
  </g>

  <g id="results-res">
    <rect x="64" y="504" width="1152" height="184" rx="10" fill="#221C18" stroke="#4A3E34"/>
    <text x="88" y="532" font-size="13" font-weight="bold" fill="#F0A63C">Resolution is the single biggest factor for fingerprints</text>

    <g id="results-res-224">
      <text x="88" y="560" font-size="11" fill="#9C8B7A">resized to 224 x 224</text>
      <rect x="88" y="570" width="170" height="96" rx="8" fill="#1A1512" stroke="#4A3E34"/>
      <path id="results-ridge-224"
        d="M10,30 C40,10 70,50 100,30 C130,10 160,50 190,30 M10,55 C40,75 70,35 100,55 C130,75 160,35 190,55 M10,80 C40,60 70,100 100,80 C130,60 160,100 190,80"
        transform="translate(96,576) scale(0.85)" fill="none" stroke="#B8322A" stroke-width="2.5" stroke-linecap="round">
        <animate attributeName="d" dur="12s" repeatCount="indefinite" calcMode="spline"
          values="M10,30 C40,10 70,50 100,30 C130,10 160,50 190,30 M10,55 C40,75 70,35 100,55 C130,75 160,35 190,55 M10,80 C40,60 70,100 100,80 C130,60 160,100 190,80;
                  M10,30 C28,8 56,52 76,27 C96,6 122,54 142,30 C162,8 182,52 190,30 M10,55 C28,80 56,36 76,59 C96,78 122,30 142,55 C162,80 182,32 190,55 M10,80 C28,56 56,104 76,77 C96,56 122,102 142,80 C162,58 182,104 190,80"
          keyTimes="0;1" keySplines="0.4 0 0.6 1"/>
      </path>
      <text x="173" y="684" font-size="12" fill="#E5533F" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">2.05% EER</text>
    </g>

    <g id="results-res-arrow">
      <path d="M270,618 L322,618" stroke="#4A3E34" stroke-width="2" fill="none"/>
      <text x="296" y="608" font-size="10" fill="#9C8B7A" text-anchor="middle">native</text>
    </g>

    <g id="results-res-native">
      <text x="336" y="560" font-size="11" fill="#9C8B7A">native, up to 388 x 388</text>
      <rect x="336" y="570" width="170" height="96" rx="8" fill="#1A1512" stroke="#4A3E34"/>
      <path d="M10,30 C40,10 70,50 100,30 C130,10 160,50 190,30 M10,55 C40,75 70,35 100,55 C130,75 160,35 190,55 M10,80 C40,60 70,100 100,80 C130,60 160,100 190,80"
        transform="translate(344,576) scale(0.85)" fill="none" stroke="#F0A63C" stroke-width="2.5" stroke-linecap="round"/>
      <text x="421" y="684" font-size="12" fill="#F0A63C" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">0.34% EER</text>
    </g>

    <g id="results-res-note">
      <text x="580" y="590" font-size="13" fill="#F6EDE1">Shrinking a 500 dpi print to 224 x 224 folds ridge</text>
      <text x="580" y="612" font-size="13" fill="#F6EDE1">frequency into aliasing. Native resolution removes</text>
      <text x="580" y="634" font-size="13" fill="#F6EDE1">the loss and cuts the error rate by 59 percent.</text>
      <rect x="580" y="650" width="600" height="14" rx="7" fill="#2E2620" stroke="#4A3E34"/>
      <rect x="580" y="650" width="0" height="14" rx="7" fill="#F0A63C">
        <animate attributeName="width" dur="12s" repeatCount="indefinite" values="0;0;246;246;0;0" keyTimes="0;0.70;0.86;0.95;1;1"/>
      </rect>
      <text x="580" y="682" font-size="11" fill="#9C8B7A">59 percent lower error rate at native resolution</text>
    </g>
  </g>
</svg>