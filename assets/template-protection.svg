<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" font-family="Arial, Helvetica, sans-serif">
  <title>BioHashing template protection with chaffing and orthogonal projection</title>
  <defs>
    <g id="biohash-keypad">
      <rect x="0" y="0" width="46" height="40" rx="7" fill="#2E2620" stroke="#4A3E34"/>
      <rect x="54" y="0" width="46" height="40" rx="7" fill="#2E2620" stroke="#4A3E34"/>
      <rect x="108" y="0" width="46" height="40" rx="7" fill="#2E2620" stroke="#4A3E34"/>
      <rect x="0" y="48" width="46" height="40" rx="7" fill="#2E2620" stroke="#4A3E34"/>
      <rect x="54" y="48" width="46" height="40" rx="7" fill="#2E2620" stroke="#4A3E34"/>
      <rect x="108" y="48" width="46" height="40" rx="7" fill="#2E2620" stroke="#4A3E34"/>
      <rect x="0" y="96" width="46" height="40" rx="7" fill="#2E2620" stroke="#4A3E34"/>
      <rect x="54" y="96" width="46" height="40" rx="7" fill="#2E2620" stroke="#4A3E34"/>
      <rect x="108" y="96" width="46" height="40" rx="7" fill="#2E2620" stroke="#4A3E34"/>
      <rect x="0" y="144" width="46" height="40" rx="7" fill="#2E2620" stroke="#4A3E34"/>
      <rect x="54" y="144" width="46" height="40" rx="7" fill="#2E2620" stroke="#4A3E34"/>
      <rect x="108" y="144" width="46" height="40" rx="7" fill="#2E2620" stroke="#4A3E34"/>
      <g font-size="15" fill="#F6EDE1" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">
        <text x="23" y="26">1</text><text x="77" y="26">4</text><text x="131" y="26">7</text>
        <text x="23" y="74">2</text><text x="77" y="74">5</text><text x="131" y="74">8</text>
        <text x="23" y="122">3</text><text x="77" y="122">6</text><text x="131" y="122">9</text>
        <text x="23" y="170">*</text><text x="77" y="170">0</text><text x="131" y="170">#</text>
      </g>
    </g>
    <filter id="biohash-glowf" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="#100D0B"/>

  <text x="64" y="56" font-size="26" font-weight="bold" fill="#F6EDE1">The template is useless without the key</text>
  <text x="64" y="78" font-size="14" fill="#9C8B7A">Chaff, then a random orthogonal projection, keeps stolen embeddings reversible to no one</text>

  <g id="biohash-step1">
    <text x="64" y="122" font-size="12" fill="#9C8B7A">1. raw embedding, d=512</text>
    <g id="biohash-raw" fill="#6B594B">
      <rect x="64" y="134" width="6" height="120" rx="2"/><rect x="73" y="146" width="6" height="96" rx="2"/>
      <rect x="82" y="156" width="6" height="76" rx="2"/><rect x="91" y="126" width="6" height="136" rx="2"/>
      <rect x="100" y="150" width="6" height="88" rx="2"/><rect x="109" y="162" width="6" height="64" rx="2"/>
      <rect x="118" y="138" width="6" height="112" rx="2"/><rect x="127" y="158" width="6" height="72" rx="2"/>
      <rect x="136" y="144" width="6" height="100" rx="2"/><rect x="145" y="170" width="6" height="48" rx="2"/>
      <rect x="154" y="134" width="6" height="120" rx="2"/><rect x="163" y="152" width="6" height="84" rx="2"/>
      <rect x="172" y="164" width="6" height="60" rx="2"/><rect x="181" y="140" width="6" height="108" rx="2"/>
      <rect x="190" y="156" width="6" height="76" rx="2"/><rect x="199" y="130" width="6" height="128" rx="2"/>
      <rect x="208" y="166" width="6" height="56" rx="2"/><rect x="217" y="148" width="6" height="92" rx="2"/>
      <rect x="226" y="136" width="6" height="116" rx="2"/><rect x="235" y="160" width="6" height="68" rx="2"/>
      <rect x="244" y="150" width="6" height="86" rx="2"/>
    </g>
  </g>

  <path id="biohash-c1" d="M268,194 L306,194" stroke="#4A3E34" stroke-width="2" fill="none"/>

  <g id="biohash-step2">
    <text x="310" y="122" font-size="12" fill="#9C8B7A">2. deterministic chaff, 512 more</text>
    <rect x="310" y="134" width="200" height="120" rx="4" fill="none" stroke="#4A3E34" stroke-dasharray="4 4"/>
    <g id="biohash-chaff" fill="#B8322A">
      <rect x="316" y="140" width="4" height="108" rx="2"/><rect x="322" y="158" width="4" height="72" rx="2"/>
      <rect x="328" y="132" width="4" height="124" rx="2"/><rect x="334" y="168" width="4" height="52" rx="2"/>
      <rect x="340" y="148" width="4" height="92" rx="2"/><rect x="346" y="162" width="4" height="64" rx="2"/>
      <rect x="352" y="136" width="4" height="116" rx="2"/><rect x="358" y="172" width="4" height="44" rx="2"/>
      <rect x="364" y="154" width="4" height="80" rx="2"/><rect x="370" y="142" width="4" height="104" rx="2"/>
      <rect x="376" y="166" width="4" height="56" rx="2"/><rect x="382" y="150" width="4" height="88" rx="2"/>
      <rect x="388" y="134" width="4" height="120" rx="2"/><rect x="394" y="160" width="4" height="68" rx="2"/>
      <rect x="400" y="146" width="4" height="96" rx="2"/><rect x="406" y="170" width="4" height="48" rx="2"/>
      <rect x="412" y="138" width="4" height="112" rx="4"/><rect x="418" y="164" width="4" height="60" rx="2"/>
      <rect x="424" y="152" width="4" height="76" rx="2"/><rect x="430" y="130" width="4" height="128" rx="2"/>
      <rect x="436" y="158" width="4" height="70" rx="2"/><rect x="442" y="144" width="4" height="100" rx="2"/>
      <rect x="448" y="168" width="4" height="50" rx="2"/><rect x="454" y="154" width="4" height="74" rx="2"/>
      <rect x="460" y="136" width="4" height="114" rx="2"/><rect x="466" y="162" width="4" height="62" rx="2"/>
      <rect x="472" y="150" width="4" height="80" rx="2"/><rect x="478" y="172" width="4" height="44" rx="2"/>
      <rect x="484" y="140" width="4" height="108" rx="2"/><rect x="490" y="158" width="4" height="70" rx="2"/>
      <rect x="496" y="132" width="4" height="126" rx="2"/><rect x="502" y="166" width="4" height="54" rx="2"/>
    </g>
    <text x="410" y="278" font-size="11" fill="#9C8B7A">doubles the vector length</text>
  </g>

  <path id="biohash-c2" d="M522,194 L560,194" stroke="#4A3E34" stroke-width="2" fill="none"/>

  <g id="biohash-step3">
    <text x="564" y="122" font-size="12" fill="#9C8B7A">3. the key</text>
    <g transform="translate(564,134)"><use xlink:href="#biohash-keypad"/></g>
    <text x="646" y="340" font-size="11" fill="#9C8B7A" text-anchor="middle">same key, same projection</text>
  </g>

  <path id="biohash-c3" d="M728,194 L766,194" stroke="#4A3E34" stroke-width="2" fill="none"/>

  <g id="biohash-step4">
    <text x="770" y="122" font-size="12" fill="#9C8B7A">4. QR orthogonal projection</text>
    <g id="biohash-qr" transform="translate(770,134)">
      <rect x="0" y="0" width="150" height="120" rx="6" fill="#1A1512" stroke="#4A3E34"/>
      <g stroke="#6B594B" stroke-width="1">
        <path d="M30,0 L30,120"/><path d="M60,0 L60,120"/><path d="M90,0 L90,120"/><path d="M120,0 L120,120"/>
      </g>
      <g id="biohash-qrline" stroke="#F0A63C" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.9">
        <path d="M0,10 L150,10"/>
        <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;0.95;0.95;0;0" keyTimes="0;0.30;0.34;0.50;0.54;1"/>
        <animateTransform attributeName="transform" type="translate" dur="12s" repeatCount="indefinite" values="0,-14;0,-14;0,106;0,106;0,-14" keyTimes="0;0.30;0.50;0.54;1"/>
      </g>
      <g stroke="#B8322A" stroke-width="2" opacity="0.7" fill="none">
        <path d="M0,30 L150,30"/><path d="M0,50 L150,50"/><path d="M0,70 L150,70"/>
      </g>
    </g>
    <text x="845" y="278" font-size="11" fill="#9C8B7A">columns stay orthogonal</text>
    <text x="845" y="296" font-size="11" fill="#9C8B7A">so the inner product survives</text>
  </g>

  <path id="biohash-c4" d="M936,194 L974,194" stroke="#4A3E34" stroke-width="2" fill="none"/>

  <g id="biohash-step5">
    <text x="978" y="122" font-size="12" fill="#9C8B7A">5. protected template</text>
    <g id="biohash-protected" fill="#F0A63C">
      <rect x="978" y="150" width="6" height="88" rx="2"/><rect x="987" y="132" width="6" height="124" rx="2"/>
      <rect x="996" y="164" width="6" height="60" rx="2"/><rect x="1005" y="142" width="6" height="104" rx="2"/>
      <rect x="1014" y="156" width="6" height="76" rx="2"/><rect x="1023" y="128" width="6" height="132" rx="2"/>
      <rect x="1032" y="170" width="6" height="48" rx="2"/><rect x="1041" y="146" width="6" height="96" rx="2"/>
      <rect x="1050" y="160" width="6" height="68" rx="2"/><rect x="1059" y="138" width="6" height="112" rx="2"/>
      <rect x="1068" y="166" width="6" height="56" rx="2"/><rect x="1077" y="134" width="6" height="120" rx="2"/>
      <rect x="1086" y="152" width="6" height="84" rx="2"/><rect x="1095" y="172" width="6" height="44" rx="2"/>
      <rect x="1104" y="144" width="6" height="100" rx="2"/><rect x="1113" y="158" width="6" height="72" rx="2"/>
      <rect x="1122" y="130" width="6" height="128" rx="2"/><rect x="1131" y="164" width="6" height="60" rx="2"/>
      <rect x="1140" y="148" width="6" height="92" rx="2"/><rect x="1149" y="168" width="6" height="52" rx="2"/>
      <rect x="1158" y="140" width="6" height="108" rx="2"/><rect x="1167" y="154" width="6" height="86" rx="2"/>
      <rect x="1176" y="132" width="6" height="124" rx="2"/><rect x="1185" y="162" width="6" height="64" rx="2"/>
      <rect x="1194" y="150" width="6" height="88" rx="2"/><rect x="1203" y="170" width="6" height="46" rx="2"/>
    </g>
  </g>

  <g id="biohash-verify">
    <rect x="64" y="368" width="1152" height="300" rx="10" fill="#221C18" stroke="#4A3E34"/>
    <text x="88" y="400" font-size="15" font-weight="bold" fill="#F0A63C">Verification still works</text>
    <text x="88" y="422" font-size="12" fill="#9C8B7A">Both sides are protected with the same key, so the raw embedding never leaves the process.</text>

    <g id="biohash-v-raw">
      <text x="120" y="470" font-size="11" fill="#9C8B7A" text-anchor="middle">enrolled</text>
      <g fill="#6B594B">
        <rect x="92" y="480" width="7" height="70" rx="2"/><rect x="103" y="496" width="7" height="40" rx="2"/>
        <rect x="114" y="472" width="7" height="84" rx="2"/><rect x="125" y="506" width="7" height="24" rx="2"/>
        <rect x="136" y="488" width="7" height="56" rx="2"/><rect x="147" y="500" width="7" height="32" rx="2"/>
      </g>
      <text x="120" y="574" font-size="10" fill="#9C8B7A" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">d=512</text>
    </g>

    <g id="biohash-v-probe">
      <text x="268" y="470" font-size="11" fill="#9C8B7A" text-anchor="middle">probe</text>
      <g fill="#6B594B">
        <rect x="240" y="482" width="7" height="66" rx="2"/><rect x="251" y="498" width="7" height="36" rx="2"/>
        <rect x="262" y="476" width="7" height="78" rx="2"/><rect x="273" y="504" width="7" height="28" rx="2"/>
        <rect x="284" y="490" width="7" height="52" rx="2"/><rect x="295" y="502" width="7" height="30" rx="2"/>
      </g>
      <text x="268" y="574" font-size="10" fill="#9C8B7A" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">d=512</text>
    </g>

    <path id="biohash-vc1" d="M320,516 L378,516" stroke="#4A3E34" stroke-width="2" fill="none"/>
    <path id="biohash-vc2" d="M320,540 L378,540" stroke="#4A3E34" stroke-width="2" fill="none"/>

    <g id="biohash-v-key">
      <rect x="382" y="470" width="120" height="110" rx="8" fill="#1A1512" stroke="#F0A63C"/>
      <text x="442" y="490" font-size="11" fill="#F0A63C" text-anchor="middle">protect</text>
      <g transform="translate(410,500) scale(0.40)"><use xlink:href="#biohash-keypad"/></g>
    </g>

    <path id="biohash-vc3" d="M506,516 L560,516" stroke="#4A3E34" stroke-width="2" fill="none"/>
    <path id="biohash-vc4" d="M506,540 L560,540" stroke="#4A3E34" stroke-width="2" fill="none"/>

    <g id="biohash-v-prot">
      <g fill="#F0A63C">
        <rect x="564" y="486" width="7" height="58" rx="2"/><rect x="575" y="502" width="7" height="28" rx="2"/>
        <rect x="586" y="478" width="7" height="72" rx="2"/><rect x="597" y="510" width="7" height="16" rx="2"/>
        <rect x="608" y="494" width="7" height="44" rx="2"/><rect x="619" y="504" width="7" height="24" rx="2"/>
      </g>
      <g fill="#F0A63C" opacity="0.75">
        <rect x="564" y="512" width="7" height="32" rx="2"/><rect x="575" y="522" width="7" height="22" rx="2"/>
        <rect x="586" y="508" width="7" height="36" rx="2"/><rect x="597" y="526" width="7" height="18" rx="2"/>
        <rect x="608" y="516" width="7" height="28" rx="2"/><rect x="619" y="524" width="7" height="20" rx="2"/>
      </g>
      <text x="592" y="574" font-size="10" fill="#9C8B7A" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">protected</text>
    </g>

    <path id="biohash-vc5" d="M644,528 L700,528" stroke="#4A3E34" stroke-width="2" fill="none"/>

    <g id="biohash-v-cos">
      <circle cx="748" cy="528" r="38" fill="#1A1512" stroke="#F0A63C" stroke-width="2"/>
      <text x="748" y="523" font-size="11" fill="#9C8B7A" text-anchor="middle">cosine</text>
      <text id="biohash-v-score" x="748" y="545" font-size="17" font-weight="bold" fill="#F0A63C" text-anchor="middle">0.92</text>
      <circle id="biohash-v-arc" cx="748" cy="528" r="38" fill="none" stroke="#FFCF7A" stroke-width="4" stroke-linecap="round"
        pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" transform="rotate(-90 748 528)">
        <animate attributeName="stroke-dashoffset" dur="12s" repeatCount="indefinite" values="100;100;8;8;100;100" keyTimes="0;0.66;0.80;0.94;1;1"/>
      </circle>
    </g>

    <path id="biohash-vc6" d="M790,528 L880,528" stroke="#4A3E34" stroke-width="2" fill="none"/>

    <g id="biohash-v-verdict">
      <path id="biohash-vc6b" d="M790,528 L880,528" stroke="#4A3E34" stroke-width="2" fill="none"/>
      <rect x="884" y="470" width="300" height="116" rx="10" fill="#1A1512" stroke="#4A3E34"/>
      <circle cx="934" cy="528" r="30" fill="none" stroke="#4A3E34" stroke-width="5"/>
      <circle id="biohash-v-ring" cx="934" cy="528" r="30" fill="none" stroke="#F0A63C" stroke-width="5" stroke-linecap="round"
        pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" transform="rotate(-90 934 528)">
        <animate attributeName="stroke-dashoffset" dur="12s" repeatCount="indefinite" values="100;100;8;8;100;100" keyTimes="0;0.70;0.84;0.94;1;1"/>
      </circle>
      <text id="biohash-v-word" x="986" y="518" font-size="20" font-weight="bold" fill="#9C8B7A">PENDING</text>
      <text id="biohash-v-sub" x="986" y="542" font-size="11" fill="#9C8B7A" font-family="Consolas, 'Courier New', monospace">0.92 vs 0.750</text>
      <text x="986" y="564" font-size="11" fill="#9C8B7A">template stays hidden</text>
    </g>
  </g>

  <g id="biohash-anim-verdict">
    <text x="986" y="518" font-size="20" font-weight="bold" fill="#F0A63C" opacity="0">MATCH
      <animate attributeName="opacity" calcMode="discrete" dur="12s" repeatCount="indefinite" values="0;1;1" keyTimes="0;0.78;1"/>
    </text>
    <animate xlink:href="#biohash-v-word" attributeName="opacity" calcMode="discrete" dur="12s" repeatCount="indefinite" values="1;0;0" keyTimes="0;0.78;1"/>
  </g>

  <g id="biohash-anim-packets" filter="url(#biohash-glowf)">
    <circle r="5" fill="#FFCF7A">
      <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" path="M268,194 L306,194" keyPoints="0;1;1" keyTimes="0;0.10;1"/>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.02;0.045;0.085;0.12;1"/>
    </circle>
    <circle r="5" fill="#FFCF7A">
      <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" path="M522,194 L560,194" keyPoints="0;1;1" keyTimes="0;0.22;1"/>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.19;0.215;0.25;0.285;1"/>
    </circle>
    <circle r="5" fill="#FFCF7A">
      <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" path="M728,194 L766,194" keyPoints="0;1;1" keyTimes="0;0.34;1"/>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.31;0.335;0.37;0.405;1"/>
    </circle>
    <circle r="5" fill="#FFCF7A">
      <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" path="M936,194 L974,194" keyPoints="0;1;1" keyTimes="0;0.56;1"/>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.53;0.555;0.59;0.625;1"/>
    </circle>
    <circle r="5" fill="#FFCF7A">
      <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" path="M320,516 L378,516" keyPoints="0;1;1" keyTimes="0;0.62;1"/>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.60;0.615;0.645;0.675;1"/>
    </circle>
    <circle r="5" fill="#FFCF7A">
      <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" path="M506,516 L560,516" keyPoints="0;1;1" keyTimes="0;0.68;1"/>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.66;0.675;0.705;0.735;1"/>
    </circle>
    <circle r="5" fill="#FFCF7A">
      <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear" path="M644,528 L700,528" keyPoints="0;1;1" keyTimes="0;0.80;1"/>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.78;0.795;0.825;0.855;1"/>
    </circle>
  </g>

  <g id="biohash-anim-keys">
    <rect x="564" y="134" width="46" height="40" rx="7" fill="none" stroke="#F0A63C" stroke-width="3">
      <animate attributeName="stroke-width" dur="12s" repeatCount="indefinite" values="1;1;3;3;1;1" keyTimes="0;0.14;0.18;0.95;1;1"/>
    </rect>
    <rect x="618" y="182" width="46" height="40" rx="7" fill="none" stroke="#F0A63C" stroke-width="3">
      <animate attributeName="stroke-width" dur="12s" repeatCount="indefinite" values="1;1;3;3;1;1" keyTimes="0;0.17;0.21;0.95;1;1"/>
    </rect>
    <rect x="672" y="278" width="46" height="40" rx="7" fill="none" stroke="#F0A63C" stroke-width="3">
      <animate attributeName="stroke-width" dur="12s" repeatCount="indefinite" values="1;1;3;3;1;1" keyTimes="0;0.20;0.24;0.95;1;1"/>
    </rect>
  </g>
</svg>